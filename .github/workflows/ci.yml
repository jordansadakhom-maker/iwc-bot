name: CI (site web)

# Barrière anti-régression : sur chaque pull request (et push sur main), on
# vérifie que le site COMPILE, que les TYPES sont bons et que les TESTS passent.
# Un échec bloque la fusion (si la protection de branche l'exige). Rapide (~3-5 min).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Une seule exécution par branche ; on annule les précédentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Le site ne nécessite PAS de secrets pour compiler (les lectures tolèrent
      # une base absente). On évite les téléchargements inutiles + la télémétrie.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Types (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build
